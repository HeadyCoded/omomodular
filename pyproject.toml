[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omomodular"
version = "0.7.5"
description = "Minimalist Omarchy-themed Eurorack modular synthesizer and ambient drone workstation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HeadyCoded" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[project.scripts]
omomodular = "omomodular.__main__:main"

[project.urls]
Homepage = "https://github.com/HeadyCoded/omomodular"

[tool.hatch.build.targets.wheel]
packages = ["omomodular"]
# web/, midi/, samples/ are git-tracked data files under omomodular/, so
# hatchling's default VCS-based inclusion already ships them with the wheel.
# (A `force-include` table here collides with that default inclusion --
# hatchling refuses to add the same destination path twice.)

[tool.pytest.ini_options]
testpaths = ["tests"]
