[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omomodular"
version = "0.7.2"
description = "Minimalist Omarchy-themed Eurorack modular synthesizer and ambient drone workstation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "xn0xinx" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[project.scripts]
omomodular = "omomodular.__main__:main"

[project.urls]
Homepage = "https://github.com/xn0xinx/omomodular"

[tool.hatch.build.targets.wheel]
packages = ["omomodular"]

[tool.hatch.build.targets.wheel.force-include]
"omomodular/web" = "omomodular/web"
"omomodular/midi" = "omomodular/midi"

[tool.pytest.ini_options]
testpaths = ["tests"]
