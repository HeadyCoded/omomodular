[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omomodular"
version = "0.0.1"
description = "TODO"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "xn0xinx" }]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
omomodular = "omomodular.__main__:main"

[project.urls]
Homepage = "https://github.com/xn0xinx/omomodular"

[tool.hatch.build.targets.wheel]
packages = ["omomodular"]

[tool.hatch.build.targets.wheel.force-include]
"omomodular/web" = "omomodular/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
