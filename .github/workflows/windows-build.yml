name: Windows build

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller omomodular.spec

      - name: Smoke test the built exe (server only, no browser window)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\omomodular\omomodular.exe" -ArgumentList "--port","8796","--no-open" -PassThru -RedirectStandardOutput "server.log" -RedirectStandardError "server.err.log"
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8796/api/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "---- stdout ----"
          Get-Content "server.log" -ErrorAction SilentlyContinue
          Write-Host "---- stderr ----"
          Get-Content "server.err.log" -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "omomodular.exe never answered /api/health"
            exit 1
          }
          Write-Host "Smoke test passed: /api/health responded 200"

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path "dist\omomodular\*" -DestinationPath "omomodular-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: omomodular-windows
          path: omomodular-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: omomodular-windows.zip
